<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorShield - Painel do Criador</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 bg-indigo-500 rounded-full animate-pulse"></span>
      <h1 class="font-bold text-lg tracking-wide text-white">CreatorShield <span class="text-xs font-normal text-slate-400">v1.0</span></h1>
    </div>
    <span class="text-xs bg-indigo-600/20 text-indigo-400 px-3 py-1 rounded-full border border-indigo-500/30">Status: Protegido</span>
  </header>

  <!-- Container Principal -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-6 space-y-6">

    <!-- Métricas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <p class="text-xs text-slate-400 font-medium">Total de Contatos</p>
        <p class="text-3xl font-black text-white mt-1" id="totalCount">12</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <p class="text-xs text-slate-400 font-medium">Segurança da Base</p>
        <p class="text-3xl font-black text-emerald-400 mt-1">100%</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <p class="text-xs text-slate-400 font-medium">Último Backup</p>
        <p class="text-3xl font-black text-indigo-400 mt-1">Hoje</p>
      </div>
    </div>

    <!-- Tabela e Controles -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-6 space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="text-lg font-bold text-white">Audiência Salva</h2>
          <p class="text-xs text-slate-400">Lista de e-mails capturados fora das plataformas de terceiros.</p>
        </div>
        <button onclick="exportCSV()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-2 rounded-xl transition flex items-center gap-2">
          ⬇ Exportar CSV
        </button>
      </div>

      <!-- Tabela -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="text-xs uppercase bg-slate-950/50 text-slate-400 border-b border-slate-800">
            <tr>
              <th class="py-3 px-4">E-mail</th>
              <th class="py-3 px-4">Origem</th>
              <th class="py-3 px-4">Data</th>
              <th class="py-3 px-4">Status</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800/50">
            <tr>
              <td class="py-3 px-4 text-white">canal.exemplo@gmail.com</td>
              <td class="py-3 px-4 text-slate-400">Landing Page</td>
              <td class="py-3 px-4 text-slate-400">17/08/2026</td>
              <td class="py-3 px-4"><span class="text-xs text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">Ativo</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    function exportCSV() {
      const csvContent = "data:text/csv;charset=utf-8,E-mail,Origem,Data\ncanal.exemplo@gmail.com,Landing Page,17/08/2026";
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "creatorshield_audiencia.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
