<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorShield - Painel do Criador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-900/50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 bg-indigo-500 rounded-full animate-pulse"></span>
      <h1 class="font-bold text-lg tracking-wide text-white">CreatorShield <span class="text-xs font-normal text-slate-400">v1.0</span></h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="userEmail" class="text-xs text-slate-400 hidden md:inline"></span>
      <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 border border-red-500/20 bg-red-500/10 px-3 py-1.5 rounded-lg transition">Sair</button>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <p class="text-xs text-slate-400 font-medium">Seus Contatos Salvos</p>
        <p class="text-3xl font-black text-white mt-1" id="totalCount">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <p class="text-xs text-slate-400 font-medium">Segurança da Sua Base</p>
        <p class="text-3xl font-black text-emerald-400 mt-1">100% Privada</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <p class="text-xs text-slate-400 font-medium">Sua Conta</p>
        <p class="text-3xl font-black text-indigo-400 mt-1">Plano Gratis</p>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-6 space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="text-lg font-bold text-white">Sua Lista de Audiência</h2>
          <p class="text-xs text-slate-400">Apenas você tem acesso a estes contatos.</p>
        </div>
        <button onclick="exportCSV()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-2 rounded-xl transition flex items-center gap-2">
          ⬇ Exportar CSV
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="text-xs uppercase bg-slate-950/50 text-slate-400 border-b border-slate-800">
            <tr>
              <th class="py-3 px-4">E-mail do Fã</th>
              <th class="py-3 px-4">Origem</th>
              <th class="py-3 px-4">Data de Entrada</th>
              <th class="py-3 px-4">Status</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800/50">
            <tr>
              <td colspan="4" class="py-4 text-center text-slate-500">Carregando seus contatos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://pmpsegvbypbuoirtyrt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8MdEp51LeQmC9ePkknH4BA_pbW8O0gt'; // Cole sua chave publicavel aqui
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let contactsData = [];

    async function checkAuthAndLoad() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('userEmail').innerText = session.user.email;
      fetchContacts();
    }

    async function fetchContacts() {
      const { data, error } = await supabaseClient.from('contacts').select('*').order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      contactsData = data;
      document.getElementById('totalCount').innerText = data.length;

      const tbody = document.getElementById('tableBody');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-slate-500">Nenhum contato na sua conta ainda.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr>
          <td class="py-3 px-4 text-white">${item.email}</td>
          <td class="py-3 px-4 text-slate-400">${item.source || 'Landing Page'}</td>
          <td class="py-3 px-4 text-slate-400">${new Date(item.created_at).toLocaleDateString('pt-BR')}</td>
          <td class="py-3 px-4"><span class="text-xs text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">${item.status || 'Ativo'}</span></td>
        </tr>
      `).join('');
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function exportCSV() {
      if (contactsData.length === 0) return alert('Sem dados para exportar.');
      let csv = "E-mail,Origem,Data\n";
      contactsData.forEach(row => {
        csv += `${row.email},${row.source},${new Date(row.created_at).toLocaleDateString('pt-BR')}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'minha_audiencia_creatorshield.csv');
      a.click();
    }

    checkAuthAndLoad();
  </script>
</body>
</html>
