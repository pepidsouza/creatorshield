<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorShield - Proteja sua Audiência</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-center items-center p-6">
  <main class="max-w-2xl text-center space-y-6">
    <span class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide uppercase">
      Para Criadores de Conteúdo
    </span>
    
    <h1 class="text-4xl md:text-6xl font-black tracking-tight text-slate-100">
      O YouTube não é seu. <br>
      <span class="text-indigo-500">Sua audiência deveria ser.</span>
    </h1>
    
    <p class="text-slate-400 text-base md:text-lg">
      Não fique refém de banimentos por erro de IA ou mudanças bruscas de algoritmo. Guarde seus contatos, automatize backups e monetize diretamente com seus fãs.
    </p>

    <!-- Cole a URL gerada pelo Formspree no atributo action abaixo -->
    <form action="SEU_LINK_DO_FORMSPREE_AQUI" method="POST" class="flex flex-col sm:flex-row gap-3 justify-center max-w-md mx-auto">
      <input type="email" name="email" required placeholder="Seu e-mail ou do seu canal..." class="px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 flex-1">
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 font-bold px-6 py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">
        Garantir Vaga
      </button>
    </form>
    
    <p class="text-xs text-slate-500">100% Gratuito para os primeiros 100 criadores cadastrados.</p>
  </main>
</body>
</html>
